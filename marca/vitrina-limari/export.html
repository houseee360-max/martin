<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;font-weight:900;src:url(BarlowCondensed-900.woff2)}
@font-face{font-family:B;font-weight:600;src:url(Barlow-600.woff2)}
body{margin:0;background:transparent}
.perfil{width:540px;height:540px;display:grid;place-items:center}
.perfil img{width:370px;margin-top:-10px}
#p-verde{background:#1458E6} #p-blanco{background:#fff} #p-amarillo{background:#FF8A00}
.h{display:inline-flex;align-items:center;gap:26px;padding:30px 40px}
.h img{width:170px}
.n{font-family:BC;font-weight:900;font-size:108px;line-height:.98;color:#0A1F44;text-transform:uppercase}
.n span{display:block;color:#1458E6}
.n small{display:block;font:600 28px B;letter-spacing:.05em;color:#3B4A66;text-transform:none;margin-top:14px}
#h-oscuro{background:#0A1F44;border-radius:24px}
#h-oscuro .n{color:#fff} #h-oscuro .n span{color:#FF8A00} #h-oscuro .n small{color:#D6E3FF}
.ap{display:inline-block;text-align:center;padding:30px 40px}
.ap img{width:260px}
.ap .n{margin-top:14px;font-size:120px}
.ap .n span{display:inline}
</style></head><body>
<div class="perfil" id="p-verde"><img src="icono-claro.svg"></div>
<div class="perfil" id="p-blanco"><img src="icono.svg"></div>
<div class="perfil" id="p-amarillo"><img src="icono.svg"></div>
<div><div class="h" id="h-claro"><img src="icono.svg"><div class="n">Vitrina<span>Limarí</span><small>Páginas web para negocios</small></div></div></div>
<div><div class="h" id="h-oscuro"><img src="icono-claro.svg"><div class="n">Vitrina<span>Limarí</span><small>Páginas web para negocios</small></div></div></div>
<div><div class="ap" id="apilado"><img src="icono.svg"><div class="n">Vitrina <span>Limarí</span></div></div></div>
<div><div id="solo-icono" style="display:inline-block;padding:10px"><img src="icono.svg" style="width:500px"></div></div>
</body></html>
